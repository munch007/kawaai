<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASL / ISL Translator Prototype</title>

<style>
body{
    margin:0;
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

header{
    background:#1e1e1e;
    padding:15px;
}

video{
    width:80%;
    max-width:800px;
    border-radius:12px;
    margin-top:20px;
    border:2px solid #333;
}

.panel{
    width:80%;
    max-width:800px;
    margin:20px auto;
    padding:15px;
    background:#222;
    border-radius:12px;
}

button{
    padding:10px 18px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.primary{
    background:#00c853;
    color:white;
}

.stop{
    background:#d50000;
    color:white;
}

.info{
    background:#2962ff;
    color:white;
}

#word{
    font-size:28px;
    color:#00ff88;
    font-weight:bold;
}

#sentence{
    font-size:24px;
    margin-top:10px;
}

#status{
    color:#ccc;
}
</style>
</head>

<body>

<header>
<h1>ASL / ISL → Text → Voice Translator</h1>
</header>

<video id="video" autoplay playsinline></video>

<div class="panel">

<button class="primary" onclick="startCamera()">Start Camera</button>
<button class="stop" onclick="stopCamera()">Stop Camera</button>
<button class="info" onclick="speakSentence()">Speak</button>
<button onclick="clearTranscript()">Clear</button>

<h3>Status</h3>
<div id="status">Ready</div>

<h3>Detected Word</h3>
<div id="word">Waiting...</div>

<h3>Sentence</h3>
<div id="sentence">No signs detected.</div>

</div>

<script>

let stream;
let detectorInterval;

async function startCamera(){

    try{

        stream = await navigator.mediaDevices.getUserMedia({
            video:true
        });

        document.getElementById("video").srcObject = stream;

        document.getElementById("status").innerText =
            "Camera Running";

        startRecognitionPrototype();

    }catch(e){

        document.getElementById("status").innerText =
            "Camera Permission Denied";

    }
}

function stopCamera(){

    clearInterval(detectorInterval);

    if(stream){
        stream.getTracks().forEach(track => track.stop());
    }

    document.getElementById("status").innerText =
        "Stopped";
}

function clearTranscript(){

    document.getElementById("word").innerText =
        "Waiting...";

    document.getElementById("sentence").innerText =
        "No signs detected.";
}

function speakSentence(){

    const text =
      document.getElementById("sentence").innerText;

    const speech =
      new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";

    speechSynthesis.speak(speech);
}

function startRecognitionPrototype(){

    const demoSigns = [
        "HELLO",
        "THANK YOU",
        "PLEASE",
        "YES",
        "NO",
        "HELP",
        "GOOD MORNING",
        "HOW ARE YOU",
        "WELCOME"
    ];

    detectorInterval = setInterval(() => {

        const sign =
          demoSigns[Math.floor(Math.random()
          * demoSigns.length)];

        document.getElementById("word").innerText =
            sign;

        document.getElementById("sentence").innerText =
            sign;

    },3000);
}

</script>

</body>
</html>
